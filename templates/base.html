{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KITUP{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block header %}{% endblock %}
</head>
<body>
    <header>
        <a href="/">
            <h3>KITUP</h3>
        </a>
        <div class="header_menu">
            {% if user.is_authenticated %}
                <a href="{% url 'teams:team_apply' %}"><p>팀매칭</p></a>
                <div class="dropdown">
                    <a href="{% url 'projects:dashboard' %}"><p>내 프로젝트</p></a>
                    <div class="dropdown-content">
                        <a href="{% url 'projects:dashboard' %}">현재 프로젝트</a>
                        <a href="{% url 'projects:project_list' %}">지난 프로젝트</a>
                    </div>
                </div>
                <a href="{% url 'projects:kitup_list' %}"><p>KITUP 프로젝트</p></a>
                <a href="{% url 'reflections:note_list' %}"><p>회고</p></a>
                <a href="{% url 'accounts:mypage' %}"><p>마이페이지</p></a>
                <a href="/accounts/logout/"><p>로그아웃</p></a>
            {% else %}
                <a href="/accounts/login/"><p>로그인</p></a>
                <a href="/accounts/signup/"><p>회원가입</p></a>
            {% endif %}
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
    </footer>
</body>
</html>
