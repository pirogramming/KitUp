{% extends 'base.html' %}
{% load static %}

{% block title %}KITUP - 레벨테스트{% endblock %}

{% block header %}
<link rel="stylesheet" href="{% static 'css/level_test.css' %}">
{% endblock %}

{% block content %}
<div class="level-test-container">
    <!-- 숨겨진 트랙 체크 필드 -->
    <input type="hidden" id="selected-track" name="selected_track" value="{{ role}}">
    <input type="hidden" id="track-completed" name="track_completed" value="false">

    <!-- 문항 화면 -->
    <div id="questions-screen" class="questions-screen">
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        
        <div class="question-header">
            <span class="question-number" id="question-number">1/10</span>
            <h2 class="question-title" id="question-title"></h2>
        </div>

        <form id="level-test-form">
            <div class="options-container" id="options-container">
                <!-- 동적으로 생성될 옵션들 -->
            </div>

            <div class="button-container">
                <button type="button" class="btn-prev" id="btn-prev" style="display: none;">이전</button>
                <button type="button" class="btn-next" id="btn-next">다음</button>
                <button type="submit" class="btn-submit" id="btn-submit" style="display: none;">제출하기</button>
            </div>
        </form>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen" class="result-screen" style="display: none;">
        <div class="result-content">
            <div class="result-icon">🎉</div>
            <h2>진단이 완료되었습니다!</h2>
            <p>당신의 <span id="result-track"></span> 레벨은</p>
            <div class="result-level-badge">
                <span class="level-text">Level</span>
                <span class="level-number" id="result-level"></span>
            </div>
        
            <p class="result-description" id="result-description"></p>
            <button class="btn-home" onclick="location.href='/'">홈으로 돌아가기</button>
        </div>
    </div>
</div>

let currentTrack = '';
let currentQuestion = 0;
let answers = [];


//답변 초기화
window.addEventListener('DOMContentLoaded', function() {
    currentTrack = document.getElementById('selected-track').value;
    answers = new Array(10).fill(null);
    
    showQuestion(0);
});

// 문항 표시
function showQuestion(index) {
    currentQuestion = index;
    const questionData = questions[currentTrack][index];
    
    document.getElementById('question-number').textContent = `${index + 1}/10`;
    document.getElementById('question-title').textContent = questionData.question;
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';
    
    questionData.options.forEach((option, i) => {
        const optionDiv = document.createElement('div');
        optionDiv.className = 'option-item';
        optionDiv.innerHTML = `
            <input type="radio" name="question-${index}" id="option-${i}" value="${i + 1}" ${answers[index] === i + 1 ? 'checked' : ''}>
            <label for="option-${i}">${option}</label>
        `;
        optionsContainer.appendChild(optionDiv);
    });
    
    // 진행률 업데이트
    const progress = ((index + 1) / 10) * 100;
    document.getElementById('progress-fill').style.width = progress + '%';
    
    // 버튼 표시 제어
    document.getElementById('btn-prev').style.display = index > 0 ? 'block' : 'none';
    document.getElementById('btn-next').style.display = index < 9 ? 'block' : 'none';
    document.getElementById('btn-submit').style.display = index === 9 ? 'block' : 'none';
}

// 이전 버튼
document.getElementById('btn-prev').addEventListener('click', function() {
    if (currentQuestion > 0) {
        showQuestion(currentQuestion - 1);
    }
});

// 다음 버튼
document.getElementById('btn-next').addEventListener('click', function() {
    const selected = document.querySelector(`input[name="question-${currentQuestion}"]:checked`);
    if (!selected) {
        alert('답변을 선택해주세요.');
        return;
    }
    
    answers[currentQuestion] = parseInt(selected.value);
    
    if (currentQuestion < 9) {
        showQuestion(currentQuestion + 1);
    }
});

// 제출
document.getElementById('level-test-form').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const selected = document.querySelector(`input[name="question-${currentQuestion}"]:checked`);
    if (!selected) {
        alert('답변을 선택해주세요.');
        return;
    }
    
    answers[currentQuestion] = parseInt(selected.value);
    
    // 점수 계산 (1번=1점, 2번=2점, 3번=3점, 4번=4점, 5번=5점)
    const totalScore = answers.reduce((sum, score) => sum + score, 0);
    
    // 레벨 판정
    let level = 0;
    let description = '';
    
    if (totalScore <= 15) {
        level = 1;
        description = '기초를 다지는 단계입니다. 차근차근 학습하며 성장해보세요!';
    } else if (totalScore <= 30) {
        level = 2;
        description = '기본기가 갖춰진 단계입니다. 실전 프로젝트로 경험을 쌓아보세요!';
    } else if (totalScore <= 45) {
        level = 3;
        description = '실무 능력을 갖춘 단계입니다. 더 도전적인 프로젝트에 참여해보세요!';
    } else {
        level = 4;
        description = '전문가 수준입니다. 후배들을 멘토링하며 함께 성장해보세요!';
    }
    
    // 서버로 결과 전송
    fetch('/api/level-test/submit/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: JSON.stringify({
            track: currentTrack,
            total_score: totalScore,
            level: level,
            answers: answers
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            // 트랙 완료 표시
            document.getElementById('track-completed').value = 'true';
            
            // 결과 표시
            const trackNames = {
                FRONTEND: '프론트엔드',
                BACKEND: '백엔드',
                PM: '기획자(PM)'
            };
            
            document.getElementById('result-track').textContent = trackNames[currentTrack];
            document.getElementById('result-level').textContent = level;
            document.getElementById('result-score').textContent = totalScore;
            document.getElementById('result-description').textContent = description;
            
            document.getElementById('questions-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'flex';
        } else {
            alert(data.error || '저장에 실패했습니다.');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('오류가 발생했습니다. 다시 시도해주세요.');
    });
});

// CSRF 토큰 가져오기 함수
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
