{% extends "base.html" %}
{% load static %}

{% block title %}비밀번호 변경 완료 - KITUP{% endblock %}

{% block header %}
<link rel="stylesheet" href="{% static 'css/password_reset.css' %}">
{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="auth-card success-card">
                <div class="success-icon">
                    ✓
                </div>
                <h1>비밀번호가 변경되었습니다</h1>
                <p>새 비밀번호로 성공적으로 변경되었습니다.</p>
                
                <div class="info-box">
                    <p>이제 새 비밀번호로 로그인하실 수 있습니다.</p>
                </div>

                <a href="{% url 'account_login' %}" class="btn-primary">로그인</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
