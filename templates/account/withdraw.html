{% extends 'base.html' %}
{% load static %}

{% block content %}
<div style="max-width: 450px; margin: 100px auto; padding: 40px; text-align: center; background: #fff; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <h2 style="color: #ff4f4f; font-size: 24px; font-weight: 800; margin-bottom: 20px;">정말 탈퇴하시겠습니까?</h2>
    
    <p style="color: #6b7280; line-height: 1.6; margin-bottom: 35px;">
        그동안 활동하신 모든 기록이 삭제되며,<br>
        이 작업은 되돌릴 수 없습니다.
    </p>

    <form method="POST">
        {% csrf_token %}
        <div style="display: flex; gap: 12px;">
            <a href="{% url 'accounts:mypage' %}" 
               style="flex: 1; padding: 15px; background: #f3f4f6; color: #4b5563; border-radius: 12px; text-decoration: none; font-weight: 700;">
                취소
            </a>
            <button type="submit" 
                    style="flex: 1; padding: 15px; background: #ff4f4f; color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer;">
                탈퇴하기
            </button>
        </div>
    </form>
</div>
{% endblock %}
